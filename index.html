<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visitor Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #080b12;
      color: #e8edf7;
      font-family: -apple-system, Arial, sans-serif;
    }
    header {
      padding: 24px 18px;
      background: #111827;
      border-bottom: 1px solid #273449;
    }
    h1 { margin: 0; font-size: 25px; }
    header p { color: #9aa8bd; }
    main { max-width: 650px; margin: 30px auto; padding: 16px; }
    .card {
      padding: 22px;
      margin-bottom: 18px;
      background: #111827;
      border: 1px solid #29364a;
      border-radius: 16px;
    }
    label { display: block; margin-top: 16px; color: #bdc9da; }
    input {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      color: white;
      background: #080b12;
      border: 1px solid #39465b;
      border-radius: 9px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      border: 0;
      border-radius: 9px;
      background: #3985ff;
      color: white;
      font-size: 16px;
      font-weight: 600;
    }
    .secondary { background: #263449; }
    .note { color: #9aa8bd; font-size: 13px; line-height: 1.5; }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <header>
    <h1>Visitor Dashboard</h1>
    <p>Связь с нами</p>
  </header>

  <main>
    <section class="card">
      <h2>Оставить контактные данные</h2>
      <p class="note">
        Заполните форму добровольно. Данные будут отправлены
        только после нажатия кнопки. Геолокация необязательна.
      </p>

      <form id="contactForm">
        <label for="name">Имя и фамилия</label>
        <input id="name" name="name" autocomplete="name" required>

        <label for="telegram">Telegram (необязательно)</label>
        <input id="telegram" name="telegram" placeholder="@username">

        <label for="instagram">Instagram (необязательно)</label>
        <input id="instagram" name="instagram"
               placeholder="Ссылка на профиль">

        <label>
          <input type="checkbox" id="consent" required
                 style="width:auto">
          Согласен отправить указанные данные владельцу сайта.
        </label>

        <button type="submit">Отправить анкету</button>
      </form>
      <p id="status" class="note" role="status"></p>
    </section>

    <section class="card">
      <h2>Геолокация</h2>
      <p class="note">
        Можно отдельно разрешить браузеру передать текущие
        координаты. Они не отправляются автоматически.
      </p>
      <button class="secondary" id="locationButton">
        Разрешить геолокацию
      </button>
      <p id="locationStatus" class="note" role="status"></p>
    </section>
  </main>

  <script>
    const status = document.getElementById('status');

    document.getElementById('contactForm').addEventListener('submit', (e) => {
      e.preventDefault();
      status.textContent =
        'Демонстрационный режим: данные не отправлены. ' +
        'Для отправки необходимо подключить защищённый сервер.';
    });

    document.getElementById('locationButton').addEventListener('click', () => {
      const output = document.getElementById('locationStatus');

      if (!navigator.geolocation) {
        output.textContent = 'Браузер не поддерживает геолокацию.';
        return;
      }

      output.textContent = 'Ожидаем разрешение браузера…';

      navigator.geolocation.getCurrentPosition(
        () => {
          output.textContent =
            'Разрешение получено. Координаты не сохраняются и не отправляются.';
        },
        () => {
          output.textContent =
            'Местоположение не предоставлено. Можно продолжить без него.';
        }
      );
    });
  </script>
</body>
</html>
